<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>수업 응답 · 빅데이터와 비즈니스인텔리전스</title>
<style>
  :root {
    --main: #6F263D; --main-soft: #f6eef1; --ink: #1f242b; --gray: #5b6570; --line: #d9dce0;
    --box: #f5f5f4; --bg: #ffffff; --ok: #1f6f43; --ok-soft: #e8f4ec; --warn: #8a5a00; --warn-soft: #fff6e0; --err: #a32020;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         font-size: 17px; line-height: 1.55; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--main); background: var(--main); color: #fff; border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  button.ghost { background: #fff; color: var(--main); }
  button.link { border: none; background: none; color: inherit; text-decoration: underline; padding: 0 4px; font-size: 14px; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], select, textarea { border: 1px solid #b9bec5; border-radius: 6px; padding: 8px 10px; background: #fff; }
  input[type=text]:focus, select:focus, textarea:focus { outline: 2px solid var(--main); outline-offset: 0; }
  .hint { color: var(--gray); font-size: 14.5px; }

  header.top { background: var(--main); color: #fff; padding: 10px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header.top .brand { font-weight: 700; font-size: 18px; }
  header.top .brand span { font-weight: 400; opacity: .9; margin-left: 6px; }
  header.top .who { margin-left: auto; font-size: 15px; }
  .banner { background: var(--warn-soft); color: var(--warn); padding: 10px 20px; border-bottom: 1px solid #f0d9a8; font-size: 15px; }
  .banner.bad { background: #fdecec; color: var(--err); border-color: #f3c4c4; }

  .card { max-width: 920px; margin: 20px auto; padding: 22px 26px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  #login { max-width: 520px; margin-top: 8vh; }
  #login h1 { margin: 0 0 6px; font-size: 22px; color: var(--main); }
  #login form { display: flex; gap: 10px; margin-top: 14px; }
  #login input { flex: 1; font-size: 22px; letter-spacing: 1px; }
  .err { color: var(--err); min-height: 1.5em; margin-top: 8px; font-size: 15px; }

  main { padding: 0 16px 40px; }
  nav.tabs { max-width: 920px; margin: 18px auto 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  nav.tabs button { background: #fff; color: var(--ink); border: 1px solid var(--line); text-align: left; padding: 8px 12px; border-radius: 8px; }
  nav.tabs button .n { font-weight: 700; color: var(--main); }
  nav.tabs button .st { display: block; font-size: 13px; color: var(--gray); }
  nav.tabs button .st.open { color: var(--main); font-weight: 700; }
  nav.tabs button .st.done { color: var(--ok); font-weight: 700; }
  nav.tabs button.on { border: 2px solid var(--main); background: var(--main-soft); padding: 7px 11px; }

  .qhead .qn { color: var(--main); font-weight: 700; font-size: 15px; }
  .qhead h2 { margin: 2px 0 6px; font-size: 22px; line-height: 1.4; }
  .qhead .hint { margin: 0 0 14px; }

  .opts { display: grid; gap: 10px; }
  .opts.wide { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .opts.wide label.opt { flex-wrap: wrap; align-content: flex-start; min-width: 0; }
  .opts.wide label.opt pre { flex-basis: 100%; min-width: 0; }
  .opts.small { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 760px) { .opts.wide, .opts.small { grid-template-columns: 1fr; } nav.tabs { grid-template-columns: repeat(2, 1fr); } }
  label.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: #fff; }
  label.opt:hover { border-color: #a9aeb5; }
  label.opt.sel { border: 2px solid var(--main); background: var(--main-soft); padding: 9px 11px; }
  label.opt input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--main); }
  label.opt .letter { font-weight: 700; font-size: 18px; color: var(--main); min-width: 2.6em; }
  label.opt pre { margin: 0; flex: 1; background: var(--box); border-radius: 6px; padding: 8px 10px; font-size: 14px; line-height: 1.5; white-space: pre; overflow-x: auto;
                  font-family: "D2Coding", Consolas, "Malgun Gothic", monospace; }
  .opts.small label.opt { justify-content: center; align-items: center; font-size: 26px; font-weight: 700; padding: 16px 10px; }
  .opts.small label.opt input { margin-top: 0; }

  .numrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .numrow input { width: 220px; font-size: 22px; }
  .numrow .unit { font-size: 20px; }
  .preview { font-size: 14.5px; color: var(--gray); margin-top: 6px; min-height: 1.4em; }
  .preview.bad { color: var(--err); }

  .form4 { display: grid; grid-template-columns: 230px 1fr; gap: 12px 16px; align-items: start; }
  .form4 > label { padding-top: 9px; font-weight: 600; font-size: 15.5px; }
  .form4 .f input[type=text] { width: 200px; }
  .form4 .f select { min-width: 240px; }
  .form4 .f .unit { margin-left: 6px; }
  .form4 textarea { width: 100%; min-height: 110px; resize: vertical; }
  @media (max-width: 760px) { .form4 { grid-template-columns: 1fr; } .form4 > label { padding-top: 0; } }

  .actions { margin-top: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .actions button.big { font-size: 18px; padding: 10px 30px; }
  .msg { font-size: 15px; }
  .msg.bad { color: var(--err); }
  .msg.ok { color: var(--ok); }

  .donebox { background: var(--ok-soft); border: 1px solid #b9dcc5; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  .donebox b { color: var(--ok); font-size: 18px; }
  .donebox .val { font-size: 18px; margin-top: 4px; white-space: pre-line; }
  .donebox .hint { margin-top: 6px; }
  .locked { background: var(--box); border-radius: 8px; padding: 18px 20px; text-align: center; }
  .locked .big { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .locked .hint { margin: 6px 0 12px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">빅데이터와 비즈니스인텔리전스<span>수업 응답</span></div>
  <div class="who" id="who" hidden>학번 <b id="whoSid"></b><button class="link" id="changeSid" type="button">학번 바꾸기</button></div>
</header>
<div id="banner" class="banner" hidden></div>

<section id="login" class="card" hidden>
  <h1>학번을 입력하세요</h1>
  <div class="hint">이름은 받지 않습니다. 교수 화면에는 학번 없이 전체 합계만 보이고, 다른 학생의 답은 이 화면에 보이지 않습니다.</div>
  <form id="loginForm" autocomplete="off">
    <input type="text" id="sid" inputmode="numeric" maxlength="12" placeholder="숫자 7~10자리" aria-label="학번">
    <button type="submit">시작</button>
  </form>
  <div class="err" id="loginErr"></div>
</section>

<main id="app" hidden>
  <nav class="tabs" id="tabs"></nav>
  <section class="card" id="panel"></section>
</main>

<script src="config.js"></script>
<script src="questions.js"></script>
<script>
(function () {
  "use strict";
  var EP = String(window.CLASS_ENDPOINT || "").trim();
  var QS = window.QUESTIONS || [];
  var LETTERS = ["가", "나", "다", "라", "마", "바"];
  var POLL_MS = 15000, JITTER_MS = 3000;
  var $ = function (id) { return document.getElementById(id); };
  var S = { sid: "", open: [], current: 0, view: 1, checkedAt: 0, checking: false, netErr: false,
            subs: {}, drafts: {}, msg: {}, sending: false };
  var pollTimer = null, pendingVisible = false;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function hms(t) { var d = new Date(t); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (x) { return String(x).padStart(2, "0"); }).join(":"); }
  function qdef(q) { for (var i = 0; i < QS.length; i++) if (QS[i].q === q) return QS[i]; return null; }
  function isOpen(q) { return S.open.indexOf(q) >= 0; }
  function fmtNum(v) { return (Math.round(v * 1000) / 1000).toLocaleString("ko-KR", { maximumFractionDigits: 3 }); }

  /* ---------- 서버 ---------- */
  // 실패(네트워크 · 서버 혼잡)하면 잠깐 쉬었다가 다시 보냄. 그 밖의 거절(closed 등)은 그대로 돌려줌
  async function call(payload, tries) {
    var lastErr = null;
    for (var i = 0; i < tries; i++) {
      try {
        var ctl = new AbortController();
        var timer = setTimeout(function () { ctl.abort(); }, 20000);
        var r = payload
          ? await fetch(EP, { method: "POST", body: JSON.stringify(payload), signal: ctl.signal })
          : await fetch(EP + (EP.indexOf("?") >= 0 ? "&" : "?") + "action=state", { cache: "no-store", signal: ctl.signal });
        var j = await r.json();
        clearTimeout(timer);
        if (j.ok || (j.msg !== "busy" && j.msg !== "server error")) return j;
        lastErr = new Error(j.msg);
      } catch (e) { lastErr = e; }
      if (i < tries - 1) await sleep(800 * (i + 1) + Math.random() * 1600);
    }
    throw lastErr || new Error("network");
  }

  function applyState(j) {
    if (j && Array.isArray(j.open)) S.open = j.open.map(Number);
    if (j && j.current !== undefined) S.current = Number(j.current) || 0;
  }

  async function refreshState() {
    if (!EP || S.checking) return;
    S.checking = true;
    renderLockedInfo();
    try { var j = await call(null, 2); if (j.ok) applyState(j); S.netErr = false; }
    catch (e) { S.netErr = true; }
    S.checking = false;
    S.checkedAt = Date.now();
    renderBanner();
  }

  // 지금 보는 문항이 잠겨 있을 때만 15초(±3초)마다 상태를 물음
  function schedule() {
    clearTimeout(pollTimer); pollTimer = null;
    if (!EP || !S.sid || isOpen(S.view)) return;
    var delay = POLL_MS + (Math.random() * 2 - 1) * JITTER_MS;
    pollTimer = setTimeout(async function () {
      if (document.hidden) { pendingVisible = true; return; }
      await refreshState(); afterCheck();
    }, delay);
  }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && pendingVisible) {
      pendingVisible = false;
      setTimeout(async function () { await refreshState(); afterCheck(); }, Math.random() * 2000);
    }
  });

  function afterCheck() {
    if (!isOpen(S.view) && S.current && isOpen(S.current) && S.current !== S.view) S.view = S.current;
    render(); schedule();
  }

  /* ---------- 화면 ---------- */
  function renderBanner() {
    var b = $("banner");
    if (!EP) { b.hidden = false; b.className = "banner bad"; b.textContent = "서버 주소가 설정되지 않았습니다 (config.js). 교수님께 알려 주세요."; return; }
    if (S.netErr) { b.hidden = false; b.className = "banner"; b.textContent = "서버에 연결하지 못했습니다. 잠시 뒤 '다시 확인'을 누르세요."; return; }
    b.hidden = true;
  }

  function renderTabs() {
    var h = "";
    QS.forEach(function (d) {
      var st = S.subs[d.q] ? '<span class="st done">제출됨</span>' : isOpen(d.q) ? '<span class="st open">열림</span>' : '<span class="st">닫힘</span>';
      h += '<button type="button" data-q="' + d.q + '" class="' + (S.view === d.q ? "on" : "") + '"><span class="n">문항 ' + d.q + '</span> ' + esc(d.tab) + st + "</button>";
    });
    $("tabs").innerHTML = h;
  }

  function subText(q, s) {
    if (!s) return "";
    return s.label;
  }

  function renderLockedInfo() {
    var el = $("lockinfo");
    if (!el) return;
    if (S.checking) { el.textContent = "확인하는 중…"; return; }
    el.textContent = S.checkedAt ? "마지막 확인 " + hms(S.checkedAt) + " · 약 15초마다 자동으로 확인합니다" : "";
  }

  function render() {
    renderBanner();
    renderTabs();
    var d = qdef(S.view);
    if (!d) return;
    var sub = S.subs[d.q];
    var h = '<div class="qhead"><div class="qn">문항 ' + d.q + " · " + esc(d.tab) + "</div><h2>" + esc(d.title) + "</h2>";
    if (d.help) h += '<p class="hint">' + esc(d.help) + "</p>";
    h += "</div>";
    if (sub) {
      h += '<div class="donebox"><b>제출됨</b> <span class="hint">' + hms(sub.at) + '</span><div class="val">' + esc(subText(d.q, sub)) + "</div>";
      h += isOpen(d.q) ? '<div class="hint">다시 제출하면 앞의 답을 바꿉니다. 마지막으로 낸 답만 셉니다.</div>' : "";
      h += "</div>";
    }
    if (isOpen(d.q)) {
      h += formHtml(d);
      var m = S.msg[d.q];
      h += '<div class="actions"><button type="button" class="big" id="submitBtn"' + (S.sending ? " disabled" : "") + ">" + (S.sending ? "보내는 중…" : sub ? "다시 제출" : "제출") + "</button>";
      h += '<span class="msg ' + (m ? m.cls : "") + '" id="msg">' + (m ? esc(m.text) : "") + "</span>";
      var nx = qdef(d.q + 1);
      if (sub && nx) h += '<button type="button" class="ghost" data-go="' + nx.q + '">다음 문항으로 →</button>';
      h += "</div>";
    } else {
      var m2 = S.msg[d.q];
      h += '<div class="locked"><div class="big">' + (sub ? "이 문항은 지금 닫혀 있습니다" : "아직 열리지 않은 문항입니다") + "</div>";
      h += '<div class="hint">교수님이 문항을 열면 이 화면에 나타납니다. 창을 닫지 말고 기다리세요.</div>';
      if (m2) h += '<div class="msg ' + m2.cls + '">' + esc(m2.text) + "</div>";
      h += '<button type="button" class="ghost" id="recheck"' + (EP ? "" : " disabled") + ">다시 확인</button>";
      h += '<div class="hint" id="lockinfo"></div></div>';
      var nx2 = qdef(d.q + 1);
      if (sub && nx2) h += '<div class="actions"><button type="button" class="ghost" data-go="' + nx2.q + '">다음 문항으로 →</button></div>';
    }
    $("panel").innerHTML = h;
    renderLockedInfo();
    bindForm(d);
  }

  function draft(q) { if (!S.drafts[q]) S.drafts[q] = {}; return S.drafts[q]; }
  function saveDrafts() { lsSet("bi12-drafts-" + S.sid, S.drafts); }

  function formHtml(d) {
    var dr = draft(d.q), h = "";
    if (d.type === "choice") {
      var small = d.options.every(function (o) { return !o.sql; });
      h += '<div class="opts ' + (small ? "small" : "wide") + '">';
      d.options.forEach(function (o, i) {
        var sel = dr.choice === o.id;
        h += '<label class="opt' + (sel ? " sel" : "") + '"><input type="radio" name="choice" value="' + esc(o.id) + '"' + (sel ? " checked" : "") + ">";
        if (o.sql) h += '<span class="letter">(' + LETTERS[i] + ")</span><pre>" + esc(o.sql) + "</pre>";
        else h += "<span>" + esc(o.label) + "</span>";
        h += "</label>";
      });
      h += "</div>";
    } else if (d.type === "number") {
      h += '<div class="numrow"><input type="text" id="num" inputmode="decimal" autocomplete="off" value="' + esc(dr.raw || "") + '" placeholder="숫자"><span class="unit">' + esc(d.unit || "") + "</span></div>";
      h += '<div class="preview" id="pv-num"></div>';
    } else if (d.type === "form") {
      h += '<div class="form4">';
      d.fields.forEach(function (f) {
        var id = "f-" + f.key, val = dr[f.key] || "";
        h += '<label for="' + id + '">' + esc(f.label) + "</label><div class=\"f\">";
        if (f.kind === "select") {
          var list = window[f.source] || [];
          h += '<select id="' + id + '" data-k="' + esc(f.key) + '"><option value="">선택하세요</option>';
          list.forEach(function (x) { h += '<option' + (x === val ? " selected" : "") + ">" + esc(x) + "</option>"; });
          h += "</select>";
        } else if (f.kind === "number") {
          h += '<input type="text" id="' + id + '" data-k="' + esc(f.key) + '" inputmode="decimal" autocomplete="off" value="' + esc(val) + '" placeholder="' + esc(f.example || "") + '"><span class="unit">' + esc(f.unit || "") + "</span>";
          h += '<div class="preview" id="pv-' + esc(f.key) + '"></div>';
        } else {
          h += '<textarea id="' + id + '" data-k="' + esc(f.key) + '" maxlength="' + (f.max || 300) + '" placeholder="예: 커피-음료 2분기 매출은 … (숫자) → … (의미) → … (행동)">' + esc(val) + "</textarea>";
          h += '<div class="hint" id="cnt-' + esc(f.key) + '"></div>';
        }
        h += "</div>";
      });
      h += "</div>";
    }
    return h;
  }

  function preview(el, pv, unit) {
    if (!pv) return;
    var raw = el.value.trim();
    if (!raw) { pv.textContent = ""; pv.className = "preview"; return; }
    var v = window.parseNumber(raw);
    if (v === null) { pv.textContent = "숫자로 읽을 수 없습니다"; pv.className = "preview bad"; }
    else { pv.textContent = "읽은 값: " + fmtNum(v) + (unit ? " " + unit : ""); pv.className = "preview"; }
  }

  function bindForm(d) {
    var dr = draft(d.q);
    var clearMsg = function () {   // 고치기 시작하면 앞의 안내를 지움
      if (!S.msg[d.q]) return;
      S.msg[d.q] = null;
      var m = $("msg"); if (m) { m.textContent = ""; m.className = "msg"; }
    };
    if (d.type === "choice") {
      document.querySelectorAll('input[name="choice"]').forEach(function (r) {
        r.addEventListener("change", function () {
          dr.choice = r.value; saveDrafts(); clearMsg();
          document.querySelectorAll("label.opt").forEach(function (l) { l.classList.toggle("sel", l.contains(r)); });
        });
      });
    } else if (d.type === "number") {
      var el = $("num");
      if (el) {
        var up = function () { dr.raw = el.value; saveDrafts(); clearMsg(); preview(el, $("pv-num"), d.unit); };
        el.addEventListener("input", up); preview(el, $("pv-num"), d.unit);
        el.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
      }
    } else if (d.type === "form") {
      d.fields.forEach(function (f) {
        var el = $("f-" + f.key);
        if (!el) return;
        var up = function () {
          dr[f.key] = el.value; saveDrafts(); clearMsg();
          if (f.kind === "number") preview(el, $("pv-" + f.key), f.unit);
          if (f.kind === "text") $("cnt-" + f.key).textContent = el.value.length + " / " + (f.max || 300) + "자";
        };
        el.addEventListener(f.kind === "select" ? "change" : "input", up);
        if (f.kind === "number") preview(el, $("pv-" + f.key), f.unit);
        if (f.kind === "text") $("cnt-" + f.key).textContent = el.value.length + " / " + (f.max || 300) + "자";
      });
    }
    var sb = $("submitBtn"); if (sb) sb.addEventListener("click", submit);
    var rc = $("recheck");
    if (rc) rc.addEventListener("click", async function () {
      rc.disabled = true; S.msg[d.q] = null;
      if (Date.now() - S.checkedAt < 3000) await sleep(3000 - (Date.now() - S.checkedAt));   // 연타 막기
      await refreshState(); afterCheck();
    });
    document.querySelectorAll("[data-go]").forEach(function (b) {
      b.addEventListener("click", function () { setView(Number(b.getAttribute("data-go")), true); });
    });
  }

  // 화면의 입력을 읽어 {value, raw, label} 또는 {error}
  function collect(d) {
    var dr = draft(d.q);
    if (d.type === "choice") {
      var idx = -1;
      d.options.forEach(function (o, i) { if (o.id === dr.choice) idx = i; });
      if (idx < 0) return { error: "보기를 하나 고르세요." };
      var o = d.options[idx];
      var label = o.sql ? "(" + LETTERS[idx] + ")" : o.label;
      return { value: o.id, raw: label, label: label + (o.sql ? "" : "행") };
    }
    if (d.type === "number") {
      var raw = String(dr.raw || "").trim();
      if (!raw) return { error: "숫자를 적으세요." };
      var v = window.parseNumber(raw);
      if (v === null) return { error: "숫자로 읽을 수 없습니다. 예: 12.5 또는 -4.2" };
      return { value: v, raw: raw, label: fmtNum(v) + " " + (d.unit || "") + (raw !== String(v) ? "  (입력: " + raw + ")" : "") };
    }
    var o4 = {}, miss = [], lines = [];
    d.fields.forEach(function (f) {
      var s = String(dr[f.key] || "").trim();
      if (f.kind === "number") {
        var n = window.parseNumber(s);
        if (n === null) miss.push(f.label);
        o4[f.key] = n;
        lines.push(f.label + ": " + (n === null ? "" : fmtNum(n) + " " + (f.unit || "")));
      } else {
        if (!s) miss.push(f.label);
        o4[f.key] = f.kind === "text" ? s.slice(0, f.max || 300) : s;
        lines.push(f.label + ": " + o4[f.key]);
      }
    });
    if (miss.length) return { error: "비었거나 숫자로 읽을 수 없는 칸: " + miss.join(", ") };
    var raw4 = [o4["업종"], o4["매출"], o4["증감률"], o4["상권"], o4["비중"]].join(" | ");
    return { value: o4, raw: raw4, label: lines.join("\n") };
  }

  async function submit() {
    var d = qdef(S.view);
    if (!d || S.sending || !isOpen(d.q)) return;
    var c = collect(d);
    if (c.error) { S.msg[d.q] = { cls: "bad", text: c.error }; render(); return; }
    if (!EP) { S.msg[d.q] = { cls: "bad", text: "서버 주소가 없어 보낼 수 없습니다." }; render(); return; }
    S.sending = true; S.msg[d.q] = null; render();
    var j = null;
    try { j = await call({ action: "submit", sid: S.sid, q: d.q, value: c.value, raw: c.raw }, 4); }
    catch (e) { j = null; }
    S.sending = false;
    if (!j) {
      S.netErr = true;
      S.msg[d.q] = { cls: "bad", text: "서버에 닿지 않아 제출되지 않았습니다. 잠시 뒤 다시 누르세요." };
    } else if (j.ok) {
      S.netErr = false;
      applyState(j);
      S.subs[d.q] = { value: c.value, label: c.label, at: Date.now() };
      lsSet("bi12-subs-" + S.sid, S.subs);
      S.msg[d.q] = { cls: "ok", text: "제출했습니다." };
    } else if (j.msg === "closed") {
      applyState(j);
      S.msg[d.q] = { cls: "bad", text: "이 문항은 방금 닫혀 제출되지 않았습니다." };
    } else if (j.msg === "bad sid") {
      S.msg[d.q] = { cls: "bad", text: "학번이 올바르지 않습니다. 위의 '학번 바꾸기'로 다시 넣으세요." };
    } else {
      S.msg[d.q] = { cls: "bad", text: "제출되지 않았습니다 (" + j.msg + "). 입력을 확인하세요." };
    }
    render(); schedule();
  }

  function setView(q, userAction) {
    S.view = q;
    lsSet("bi12-view", q);
    render();
    if (!isOpen(q) && userAction && EP && Date.now() - S.checkedAt > 5000) {
      refreshState().then(afterCheck);
    } else {
      schedule();
    }
  }

  /* ---------- 학번 ---------- */
  function showLogin(err) {
    clearTimeout(pollTimer);
    $("app").hidden = true; $("who").hidden = true; $("login").hidden = false;
    $("sid").value = S.sid || lsGet("bi12-sid", "") || "";
    $("loginErr").textContent = err || "";
    $("sid").focus();
  }

  async function start(sid) {
    S.sid = sid;
    lsSet("bi12-sid", sid);
    S.subs = lsGet("bi12-subs-" + sid, {}) || {};
    S.drafts = lsGet("bi12-drafts-" + sid, {}) || {};
    S.msg = {};
    $("login").hidden = true; $("app").hidden = false; $("who").hidden = false;
    $("whoSid").textContent = sid;
    S.view = Number(lsGet("bi12-view", 1)) || 1;
    render();
    if (Date.now() - S.checkedAt > 5000) await refreshState();
    if (S.current && isOpen(S.current)) S.view = S.current;
    else if (!isOpen(S.view) && S.open.length) S.view = S.open[0];
    render(); schedule();
  }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("sid").value.normalize("NFKC").replace(/[\s-]/g, "");
    if (!/^\d{7,10}$/.test(v)) { $("loginErr").textContent = "학번은 숫자 7~10자리입니다."; return; }
    start(v);
  });
  $("changeSid").addEventListener("click", function () { showLogin(""); });
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-q]");
    if (b) { S.msg[Number(b.getAttribute("data-q"))] = null; setView(Number(b.getAttribute("data-q")), true); }
  });

  renderBanner();
  var saved = lsGet("bi12-sid", "");
  if (saved && /^\d{7,10}$/.test(saved)) start(saved); else showLogin("");
})();
</script>
</body>
</html>
