bio: >
  Hojun Kang is an Assistant Professor in the Division of Business Administration at
  Dongduk Women's University. His research asks how AI systems are governed, where they
  can be trusted as instruments of measurement and simulation, and what they reveal about
  risk in financial and housing markets. He previously served as a Senior Researcher in
  the AI Policy Research Division of the Software Policy & Research Institute (SPRI),
  leading analysis of AI regulatory trends, impact assessment of high-impact AI systems,
  and measurement of the AI industry. He holds a Ph.D. and M.A. in Management Information
  Systems from Sogang University.

interests:
  - name: AI policy and governance
    detail: regulatory impact assessment, high-impact AI systems, AI industry measurement
  - name: LLM agents for economic and social science
