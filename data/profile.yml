working_paper_summaries:
  Vote Market: >-
    What an openly traded market in governance votes costs, captures, and changes: control is
    priced competitively yet captured by a paying minority, financed by diluting non-voting holders.
  MISQ-Vote: >-
    Betrayed principals exit no more than others, so the binding constraint on accountability
    is attention rather than the cost of exit.
  GEN-AI: >-
    A capability-dependent validity boundary for LLM-agent testbeds that appears only once the
    mechanism's constraint binds.
  CBDC-Freeze: >-
    What the ability to freeze digital dollars captures, and what it costs the holders who
    never trip it.
  Census-Climate: >-
    No aggregate effect but a large denial gap in manufactured housing — a regressive and
    otherwise invisible incidence of climate credit risk.
  NYC-Renovation: >-
    An inverse dose-response in which the smallest permitted works displace the most tenants,
    strengthened after rent-regulation reform.
  Census-RE: >-
    Illiquidity forecasts lower future returns, the opposite of the financial illiquidity
    premium, and diffuses spatially across neighborhoods.
  EOA-ETH: >-
    The standard run-risk estimator holds where intermediation is thin but is dominated by
    wrapper mechanics otherwise.
  Crypto ETF: >-
    A positive integration effect only for Ethereum, with an integration-headroom decomposition
    explaining the Bitcoin and Solana nulls.
  Audit GNN: >-
    Parity with the strongest tabular learner, with the graph's value residing in
    relation-level explanation of accounting-risk contagion.
  BTC-ETF: >-
    Evidence too fragile to support or refute the venue channel, with effects reversing across
    plausible venue proxies.
  Crypto-Efficiency: >-
    Segmented blocs at the median fuse in the tails, with crypto a net receiver rather than a
    shock source.
  Crypto+RE+Market: >-
    Segmented blocs at the median fuse in the tails, with crypto a net receiver rather than a
    shock source.
  강태영: >-
    A delayed contraction of housing starts that turns violent in cost-surge regimes and
    concentrates in demand-weak regions.
  홍남주: >-
    The redevelopment premium attaches at assignment and to ownership alone, forming before
    the winners are announced.
  변호균: >-
    Valuation compression outside the capital region but no anchored response in Seoul,
    widening the regional gap.
  Walk2Attn: >-
    Dual encoding pairing Node2Vec random walks with Transformer self-attention; ablations
    confirm the two encoders are synergistic.
  TVP-QVAR Mortgage: >-
    Daily pass-through and time-varying quantile connectedness reveal two distinct speeds at
    which a rate shock reaches US mortgage markets.
